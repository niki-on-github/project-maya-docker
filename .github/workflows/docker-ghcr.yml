name: Build and publish Docker image

# Keeps the image in step with upstream's newest tag: a daily cron resolves
# mw00/project-maya's newest tag and pushes ghcr.io/<owner>/<repo> with that
# tag's source, tagged <upstream-tag> and latest.  A tag is rebuilt only when
# the corresponding image is not on GHCR yet (schedule); manual dispatches and
# pushes to main always build.
on:
  schedule:
    - cron: "20 6 * * *"   # daily 06:20 UTC
  workflow_dispatch:
    inputs:
      maya_ref:
        description: "Upstream ref/tag to build (default: the newest tag)"
        required: false
        default: ""
      cuda_arch:
        description: "CUDA_ARCHITECTURES (empty = 80, the CMP 170HX default)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: mw00/project-maya
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve upstream's newest tag
        id: latest
        run: |
          if [ -n "${{ inputs.maya_ref || '' }}" ]; then
            TAG="${{ inputs.maya_ref }}"
          else
            TAG=$(git ls-remote --tags "https://github.com/$UPSTREAM.git" \
              | awk -F/ '{print $3}'; true)
            TAG=$(echo "$TAG" | grep -v '\^{}$' | grep '^v' | sort -V | uniq | tail -1)
          fi
          [ -n "$TAG" ] || { echo "no tag found" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: $TAG"

      - name: Is this image tag published already?
        id: published
        env:
          TAG: ${{ steps.latest.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          TOKEN=$(curl -sf "https://ghcr.io/token?scope=repository:$REPO:pull" | jq -r .token)
          PUBLISHED=$(curl -sf -H "Authorization: Bearer $TOKEN" \
            "https://ghcr.io/v2/${REPO}/tags/list" | jq -r '.tags // [] | join("\n")')
          echo "Tags on GHCR now:"
          echo "$PUBLISHED"
          NEEDS_BUILD=yes
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "$PUBLISHED" | grep -qx "$TAG" && NEEDS_BUILD=no || NEEDS_BUILD=yes
          fi
          echo "needs_build=$NEEDS_BUILD" >> "$GITHUB_OUTPUT"
          echo "Newest upstream tag: $TAG - needs build: $NEEDS_BUILD"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.published.outputs.needs_build == 'yes'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MAYA_REF=${{ steps.latest.outputs.tag }}
            CUDA_ARCHITECTURES=${{ inputs.cuda_arch || '80' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.latest.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
