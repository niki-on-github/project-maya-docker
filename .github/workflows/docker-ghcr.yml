name: Build and publish Docker image

# Keeps the images in step with upstream's newest tag: a daily cron resolves
# mw00/project-maya's newest tag and pushes ghcr.io/<owner>/<repo> for BOTH
# architectures - CMP 170HX (sm80) and Pascal / Tesla P40 (sm61) - each tagged
# <arch>-<upstream-tag> (e.g. sm80-v1.1.15, sm61-v1.1.15) and <arch>-latest.
# Both are built on every run.
on:
  schedule:
    - cron: "20 6 * * *"   # daily 06:20 UTC
  workflow_dispatch:
    inputs:
      maya_ref:
        description: "Upstream ref/tag to build (default: the newest tag)"
        required: false
        default: ""
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: mw00/project-maya
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda_arch: 80
            suffix: sm80   # CMP 170HX (GA100), A100
          - cuda_arch: 61
            suffix: sm61   # Tesla P40 / P100, GTX 10 (Pascal, experimental)
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Resolve upstream's newest tag
        id: latest
        run: |
          if [ -n "${{ inputs.maya_ref || '' }}" ]; then
            TAG="${{ inputs.maya_ref }}"
          else
            TAG=$(git ls-remote --tags "https://github.com/$UPSTREAM.git" \
              | awk -F/ '{print $3}'; true)
            TAG=$(echo "$TAG" | grep -v '\^{}$' | grep '^v' | sort -V | uniq | tail -1)
          fi
          [ -n "$TAG" ] || { echo "no tag found" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream tag: $TAG"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            MAYA_REF=${{ steps.latest.outputs.tag }}
            CUDA_ARCHITECTURES=${{ matrix.cuda_arch }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.suffix }}-${{ steps.latest.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ matrix.suffix }}-latest
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
